<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MyStorage — Viewer</title>
  <link rel="icon" type="image/png" href="../assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"/>
  <link rel="stylesheet" href="../styles/nightmode.css"/>
  <script src="../scripts/theme-boot.js"></script>
  <script src="../scripts/nightmode.js" defer></script>
  <style>
    :root {
      --ink:     #0f0e0d;
      --ink-2:   #2a2825;
      --ink-3:   #5a5754;
      --ink-4:   #9a9693;
      --ink-5:   #c8c4c0;
      --paper:   #f7f5f2;
      --paper-2: #efece8;
      --paper-3: #e8e4df;
      --white:   #fdfcfb;
      --border:   rgba(15,14,13,0.08);
      --border-2: rgba(15,14,13,0.14);
      --border-3: rgba(15,14,13,0.22);
      --accent:      #c8602a;
      --accent-2:    #a84e20;
      --accent-light: rgba(200,96,42,0.08);
      --green:  #2d6a4f;
      --red:    #c0392b;
      --shadow-sm: 0 2px 8px rgba(15,14,13,0.08);
      --shadow-md: 0 4px 20px rgba(15,14,13,0.10);
      --shadow-lg: 0 12px 40px rgba(15,14,13,0.12);
      --radius-sm: 10px;
      --radius:    14px;
      --ease-spring: cubic-bezier(0.34,1.56,0.64,1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', 'Outfit', sans-serif;
      background: var(--paper);
      color: var(--ink-2);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      opacity: 0.022;
      pointer-events: none;
      z-index: 0;
    }

    .topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: 60px;
      display: flex; align-items: center; gap: 14px;
      padding: 0 20px;
      background: var(--ink);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      box-shadow: var(--shadow-sm);
    }

    .topbar-logo {
      display: flex; align-items: center; gap: 8px;
      text-decoration: none; flex-shrink: 0;
    }
    .topbar-logo-icon {
      background: transparent; border: none; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.25s var(--ease-spring);
    }
    .topbar-logo:hover .topbar-logo-icon { transform: rotate(-8deg) scale(1.08); }
    .topbar-logo-name {
      font-family: 'Outfit', sans-serif;
      font-size: 15px; font-weight: 600;
      color: rgba(255,255,255,0.92);
      letter-spacing: -0.03em;
    }
    .topbar-divider {
      width: 1px; height: 20px;
      background: rgba(255,255,255,0.12);
      flex-shrink: 0;
    }
    .btn-back {
      display: flex; align-items: center; gap: 7px;
      padding: 7px 12px;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: var(--radius-sm);
      color: rgba(255,255,255,0.6);
      font-family: inherit;
      font-size: 13px; font-weight: 500;
      cursor: pointer; text-decoration: none;
      transition: all 0.2s; white-space: nowrap; flex-shrink: 0;
    }
    .btn-back:hover {
      background: var(--accent-light);
      border-color: rgba(200,96,42,0.3);
      color: var(--accent);
    }
    .btn-back i { transition: transform 0.2s var(--ease-spring); }
    .btn-back:hover i { transform: translateX(-3px); }

    .file-info {
      flex: 1; min-width: 0;
      display: flex; flex-direction: column; gap: 1px;
    }
    .file-title {
      font-size: 13.5px; font-weight: 600;
      color: rgba(255,255,255,0.92);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .file-meta {
      font-size: 11px; color: rgba(255,255,255,0.45);
      font-family: 'JetBrains Mono', monospace; white-space: nowrap;
    }

    .topbar-actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }

    .btn-action {
      display: flex; align-items: center; gap: 6px;
      padding: 7px 14px;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: var(--radius-sm);
      background: transparent;
      color: rgba(255,255,255,0.6);
      font-family: inherit;
      font-size: 13px; font-weight: 500;
      cursor: pointer; transition: all 0.2s;
      text-decoration: none; white-space: nowrap;
    }
    .btn-action:hover {
      background: var(--accent-light);
      border-color: rgba(200,96,42,0.3);
      color: var(--accent);
    }
    .btn-action i { transition: transform 0.25s var(--ease-spring); }
    .btn-action:hover i { transform: scale(1.15); }
    .btn-action.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .btn-action.primary:hover {
      background: var(--accent-2);
      border-color: var(--accent-2);
      color: #fff;
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }

    .viewer-wrap {
      position: fixed;
      top: 60px; left: 0; right: 0; bottom: 0;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Loading */
    .loading-state {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 16px; color: var(--ink-4);
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--border-2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-state p { font-size: 14px; color: var(--ink-4); }

    /* Error */
    .error-state {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 12px; text-align: center; padding: 40px;
    }
    .error-state i { font-size: 52px; color: var(--red); opacity: 0.6; }
    .error-state h3 { font-size: 18px; font-weight: 600; color: var(--ink); font-family: 'Outfit', sans-serif; }
    .error-state p { font-size: 13px; color: var(--ink-4); max-width: 380px; line-height: 1.6; }

    /* PDF */
    iframe.pdf-viewer {
      width: 100%; height: 100%;
      border: none; background: #fff;
    }

    /* Image */
    .img-viewer-wrap {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      padding: 24px; overflow: auto;
    }
    .img-viewer-wrap img {
      max-width: 100%; max-height: 100%;
      object-fit: contain;
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
    }

    /* Video */
    .video-viewer-wrap {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      padding: 24px; background: var(--ink);
    }
    video {
      max-width: 100%; max-height: 100%;
      border-radius: var(--radius);
      box-shadow: 0 8px 48px rgba(15,14,13,0.5);
    }

    /* Audio */
    .audio-viewer-wrap {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 28px; padding: 40px;
    }
    .audio-icon-big {
      width: 100px; height: 100px;
      border-radius: 50%;
      background: var(--accent-light);
      display: flex; align-items: center; justify-content: center;
      border: 2px solid rgba(200,96,42,0.25);
      animation: pulse-ring 2s ease-in-out infinite;
    }
    .audio-icon-big i { font-size: 44px; color: var(--accent); }
    @keyframes pulse-ring {
      0%,100% { box-shadow: 0 0 0 0 rgba(200,96,42,0.2); }
      50%      { box-shadow: 0 0 0 16px rgba(200,96,42,0.04); }
    }
    .audio-name {
      font-size: 18px; font-weight: 600; color: var(--ink);
      text-align: center; max-width: 360px;
      font-family: 'Outfit', sans-serif;
    }
    audio { width: 380px; max-width: 90vw; accent-color: var(--accent); }

    /* Office / Generic — tidak bisa preview langsung */
    .generic-viewer {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 20px; padding: 40px; text-align: center;
    }
    .generic-icon-box {
      width: 90px; height: 90px;
      border-radius: 22px;
      display: flex; align-items: center; justify-content: center;
      font-size: 42px;
      border: 1px solid var(--border-2);
    }
    .generic-viewer h3 { font-size: 18px; font-weight: 600; color: var(--ink); font-family: 'Outfit', sans-serif; }
    .generic-viewer p { font-size: 13px; color: var(--ink-4); max-width: 360px; line-height: 1.7; }
    .generic-viewer .ext-badge {
      display: inline-block;
      padding: 3px 12px;
      border-radius: 99px;
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      background: var(--paper-2);
      border: 1px solid var(--border-2);
      color: var(--ink-3);
      letter-spacing: 0.06em;
    }
    .btn-group { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }

    /* Toast */
    .toast {
      position: fixed; bottom: 28px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--ink);
      color: var(--white);
      border: 1px solid rgba(255,255,255,0.08);
      padding: 12px 20px;
      border-radius: var(--radius);
      display: flex; align-items: center; gap: 10px;
      font-size: 13.5px; font-weight: 500;
      box-shadow: var(--shadow-lg);
      z-index: 999;
      opacity: 0; pointer-events: none;
      transition: all 0.3s var(--ease-spring);
    }
    .toast.show { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<div class="topbar">
  <a class="topbar-logo" href="../Storage-dashboard.html">
    <div class="topbar-logo-icon">
      <img src="../assets/logo.png" alt="MyStorage" style="width:36px;height:36px;object-fit:contain;">
    </div>
    <span class="topbar-logo-name">MyStorage</span>
  </a>
  <div class="topbar-divider"></div>
  <a class="btn-back" href="../Storage-dashboard.html">
    <i class="ti ti-arrow-left"></i> Kembali
  </a>
  <div class="file-info">
    <div class="file-title" id="fileTitle">Memuat file...</div>
    <div class="file-meta" id="fileMeta"></div>
  </div>
  <div class="topbar-actions">
    <button class="btn-action" id="btnShare">
      <i class="ti ti-share"></i> Bagikan
    </button>
    <button class="btn-action primary" id="btnDownload">
      <i class="ti ti-download"></i> Download
    </button>
  </div>
</div>

<div class="viewer-wrap" id="viewerWrap">
  <div class="loading-state" id="loadingState">
    <div class="spinner"></div>
    <p>Memuat file...</p>
  </div>
</div>

<div class="toast" id="toast">
  <i class="ti ti-check" style="font-size:16px;flex-shrink:0" id="toastIcon"></i>
  <span id="toastMsg">Berhasil!</span>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../scripts/supabase-config.js"></script>
<script src="../scripts/viewer.js" defer></script>
</body>
</html>
